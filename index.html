<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music</title>

<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="dns-prefetch" href="//www.youtube.com">

<style>
:root{
--bg:#080808;
--panel:#121216;
--line:rgba(255,255,255,.08);
--text:#fff;
--muted:#aaa;
--accent:#ffd76a;
}

*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
display:grid;
place-items:center;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}

.refresh{
position:absolute;
top:16px;
right:18px;
text-align:right;
}

.refresh button{
padding:0;
border:0;
background:none;
color:#fff;
font:inherit;
font-size:12px;
cursor:pointer;
opacity:.8;
}

.refreshed{
display:block;
margin-top:4px;
font-size:9px;
color:rgba(255,255,255,.45);
}

.deck{
width:min(420px,92vw);
max-height:94vh;
background:var(--panel);
border:1px solid var(--line);
border-radius:20px;
overflow:hidden;
box-shadow:0 25px 60px rgba(0,0,0,.7);
}

.top{
padding:20px 18px 18px;
border-bottom:1px solid var(--line);
}

.label{
text-align:center;
font-family:Georgia,"Times New Roman",serif;
font-size:21px;
font-weight:600;
letter-spacing:.04em;
animation:pulse 4s ease-in-out infinite;
}

.title{
margin-top:7px;
text-align:center;
font-size:12px;
color:var(--muted);
}

.player{
width:100%;
aspect-ratio:16/9;
margin-top:16px;
overflow:hidden;
border-radius:10px;
background:#000;
box-shadow:0 12px 30px rgba(0,0,0,.75);
}

.player iframe{
width:100%;
height:100%;
}

.track-info{
padding:14px 18px 0;
text-align:center;
}

.track-name{
font-size:14px;
font-weight:600;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.artist-name{
min-height:14px;
margin-top:3px;
font-size:11px;
color:var(--muted);
}

.controls{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
padding:12px 16px 16px;
border-bottom:1px solid var(--line);
}

.control,.play{
border:0;
cursor:pointer;
}

.control{
background:none;
color:#fff;
font-size:20px;
}

#previous{
justify-self:end;
margin-right:30px;
}

#next{
justify-self:start;
margin-left:30px;
}

.play{
width:56px;
height:56px;
border-radius:50%;
background:#fff;
color:#111;
font-size:20px;
}

.library{
padding:12px 16px 16px;
}

.library-toggle{
width:100%;
display:flex;
justify-content:center;
align-items:center;
gap:7px;
padding:10px;
border:0;
background:none;
color:var(--muted);
font-size:11px;
letter-spacing:.08em;
text-transform:uppercase;
cursor:pointer;
}

.chevron{
transition:transform .2s ease;
}

.library-toggle.open .chevron{
transform:rotate(180deg);
}

.playlist-wrap{
max-height:0;
overflow:hidden;
transition:max-height .25s ease;
}

.playlist-wrap.open{
max-height:132px;
overflow-y:auto;
}

.playlist{
width:100%;
height:44px;
display:flex;
align-items:center;
justify-content:center;
border:0;
border-top:1px solid var(--line);
background:none;
color:#fff;
font-size:12px;
cursor:pointer;
}

.playlist.active{
color:var(--accent);
}

@keyframes pulse{
0%,100%{opacity:.72}
50%{opacity:1}
}

@media(prefers-reduced-motion:reduce){
.label{animation:none}
}
</style>
</head>

<body>

<div class="refresh">
<button id="refresh">Refresh ↻</button>
<span class="refreshed" id="refreshed"></span>
</div>

<main class="deck">

<section class="top">
<div class="label">Now Playing</div>
<div class="title" id="title">Blaze's Cool Mixtape</div>

<div class="player">
<div id="player"></div>
</div>
</section>

<div class="track-info">
<div class="track-name" id="trackName">Loading...</div>
<div class="artist-name" id="artistName"></div>
</div>

<section class="controls">
<button class="control" id="previous" aria-label="Previous video">◀</button>
<button class="play" id="play" aria-label="Play">▶</button>
<button class="control" id="next" aria-label="Next video">▶</button>
</section>

<section class="library">
<button class="library-toggle" id="libraryToggle">
<span>Playlists</span>
<span class="chevron">⌄</span>
</button>

<div class="playlist-wrap" id="playlistWrap">
<div id="playlistList"></div>
</div>
</section>

</main>

<script type="application/json" id="playlistData">
{
  "playlists":[
    {
      "title":"Blaze's Cool Mixtape",
      "id":"PLauF-OVoaXM8",
      "active":true
    },
    {
      "title":"Adventurer's Tale",
      "id":"PLIH8J_XrFteM",
      "active":true
    }
  ]
}
</script>

<script>
const $=id=>document.getElementById(id);

const playlists=JSON.parse(
$("playlistData").textContent
).playlists.filter(p=>p.active);

const title=$("title");
const trackName=$("trackName");
const artistName=$("artistName");
const playButton=$("play");
const list=$("playlistList");
const wrap=$("playlistWrap");
const toggle=$("libraryToggle");

let player;
let ready=false;
let current=0;
let switchTimer;

const now=new Date();

$("refreshed").textContent=
"Last refreshed "+now.toLocaleString([],{
month:"short",
day:"numeric",
hour:"numeric",
minute:"2-digit"
});

$("refresh").onclick=()=>location.reload();

function updateTrack(){
if(!ready)return;

const data=player.getVideoData();

if(!data?.title)return;

trackName.textContent=data.title;
artistName.textContent=data.author||"";
}

function updateActive(){
[...list.children].forEach((button,index)=>{
button.classList.toggle("active",index===current);
});
}

function switchPlaylist(index){
if(!ready||index===current)return;

clearTimeout(switchTimer);

current=index;
title.textContent=playlists[index].title;
trackName.textContent="Loading...";
artistName.textContent="";

updateActive();
player.stopVideo();

switchTimer=setTimeout(()=>{
player.loadPlaylist({
listType:"playlist",
list:playlists[index].id,
index:0
});
},500);
}

playlists.forEach((playlist,index)=>{
const button=document.createElement("button");

button.className="playlist";
button.textContent=playlist.title;

button.onclick=()=>{
switchPlaylist(index);
wrap.classList.remove("open");
toggle.classList.remove("open");
};

list.appendChild(button);
});

updateActive();

toggle.onclick=()=>{
const open=wrap.classList.toggle("open");
toggle.classList.toggle("open",open);
};

playButton.onclick=()=>{
if(!ready)return;

player.getPlayerState()===YT.PlayerState.PLAYING
?player.pauseVideo()
:player.playVideo();
};

$("previous").onclick=()=>{
if(ready)player.previousVideo();
};

$("next").onclick=()=>{
if(ready)player.nextVideo();
};

function onYouTubeIframeAPIReady(){
player=new YT.Player("player",{
playerVars:{
playsinline:1,
rel:0
},
events:{
onReady:event=>{
ready=true;

event.target.cuePlaylist({
listType:"playlist",
list:playlists[0].id,
index:0
});
},

onStateChange:event=>{
const playing=event.data===YT.PlayerState.PLAYING;

playButton.textContent=playing?"Ⅱ":"▶";
playButton.setAttribute(
"aria-label",
playing?"Pause":"Play"
);

if(
event.data===YT.PlayerState.PLAYING||
event.data===YT.PlayerState.CUED
){
updateTrack();
}
}
}
});
}
</script>

<script async src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
