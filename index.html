<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q Deck</title>

<style>
:root{
--bg:#0d0d0d;
--panel:#171717;
--line:#2a2a2a;
--text:#f4f4f4;
--muted:#8a8a8a;
--accent:#ffd500;
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:grid;
place-items:center;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}

.deck{
width:min(420px,94vw);
background:var(--panel);
border:1px solid var(--line);
border-radius:20px;
overflow:hidden;
}

.top{
padding:18px;
border-bottom:1px solid var(--line);
}

.brand{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
font-size:12px;
letter-spacing:.12em;
text-transform:uppercase;
color:var(--muted);
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:var(--accent);
}

.label{
font-size:11px;
letter-spacing:.1em;
text-transform:uppercase;
color:var(--muted);
}

.title{
margin:6px 0 4px;
font-size:23px;
font-weight:600;
}

.sub{
font-size:13px;
color:var(--muted);
}

.video{
width:100%;
aspect-ratio:16/9;
margin-top:16px;
border:0;
border-radius:10px;
background:#000;
}

.controls{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
padding:18px;
border-bottom:1px solid var(--line);
}

.control{
border:0;
background:none;
color:var(--text);
font-size:20px;
cursor:pointer;
}

.control:first-child{
justify-self:end;
margin-right:30px;
}

.control:last-child{
justify-self:start;
margin-left:30px;
}

.play{
width:58px;
height:58px;
border-radius:50%;
border:1px solid var(--line);
background:#fff;
color:#111;
font-size:20px;
cursor:pointer;
}

.library{
padding:16px;
}

.library-head{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:12px;
color:var(--muted);
}

.playlist{
width:100%;
display:grid;
grid-template-columns:34px 1fr auto;
align-items:center;
gap:10px;
padding:13px 6px;
border:0;
border-top:1px solid var(--line);
background:none;
color:var(--text);
text-align:left;
cursor:pointer;
}

.playlist:first-of-type{
border-top:0;
}

.number{
font-size:12px;
color:var(--accent);
}

.name{
font-size:15px;
}

.arrow{
color:var(--muted);
}

.playlist:hover .arrow{
color:var(--accent);
}
</style>
</head>

<body>

<main class="deck">

<section class="top">
<div class="brand">
<span>Q Deck</span>
<span class="dot"></span>
</div>

<div class="label">Now Playing</div>
<div class="title" id="title">Blaze's Cool Mixtape</div>
<div class="sub">YouTube Playlist</div>

<iframe
id="player"
class="video"
src="https://www.youtube-nocookie.com/embed/videoseries?list=PLauF-OVoaXM8"
title="Blaze's Cool Mixtape"
allow="autoplay; encrypted-media"
allowfullscreen>
</iframe>
</section>

<section class="controls">
<button class="control" aria-label="Previous">◀</button>
<button class="play" aria-label="Play">▶</button>
<button class="control" aria-label="Next">▶</button>
</section>

<section class="library">
<div class="library-head">
<span>Playlists</span>
<span id="count"></span>
</div>

<div id="playlistList"></div>
</section>

</main>

<script type="application/json" id="playlistData">
{
"playlists":[
{
"title":"Blaze's Cool Mixtape",
"id":"PLauF-OVoaXM8",
"active":true
}
]
}
</script>

<script>
const data=JSON.parse(document.getElementById("playlistData").textContent);
const playlists=data.playlists.filter(x=>x.active);
const list=document.getElementById("playlistList");
const player=document.getElementById("player");
const title=document.getElementById("title");

document.getElementById("count").textContent=playlists.length;

playlists.forEach((p,i)=>{
const b=document.createElement("button");
b.className="playlist";
b.innerHTML=`
<span class="number">${String(i+1).padStart(2,"0")}</span>
<span class="name">${p.title}</span>
<span class="arrow">›</span>`;
b.onclick=()=>{
title.textContent=p.title;
player.src=`https://www.youtube-nocookie.com/embed/videoseries?list=${encodeURIComponent(p.id)}`;
};
list.appendChild(b);
});
</script>

</body>
</html>
