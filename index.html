<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music</title>

<style>
:root{
--panel:#171717;
--line:#2a2a2a;
--text:#fff;
--muted:#aaa;
--accent:#ffd500;
}

*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}

body{
display:grid;
place-items:center;
background:
radial-gradient(circle at 20% 20%,rgba(255,255,255,.9) 0 1px,transparent 1.5px),
radial-gradient(circle at 70% 35%,rgba(255,255,255,.7) 0 1px,transparent 1.5px),
radial-gradient(circle at 40% 75%,rgba(255,255,255,.8) 0 1px,transparent 1.5px),
linear-gradient(160deg,#12051f 0%,#291047 45%,#090612 100%);
background-size:90px 90px,130px 130px,170px 170px,100% 100%;
position:relative;
}

.comet{
position:absolute;
width:90px;
height:2px;
background:linear-gradient(90deg,transparent,#ffd86a);
transform:rotate(-35deg);
opacity:.8;
animation:comet 9s linear infinite;
pointer-events:none;
}

.comet::after{
content:"";
position:absolute;
right:-3px;
top:-2px;
width:6px;
height:6px;
border-radius:50%;
background:#ffd86a;
box-shadow:0 0 10px #ffd86a;
}

.comet:nth-child(1){
top:14%;
left:-120px;
animation-delay:1s;
}

.comet:nth-child(2){
top:48%;
left:-160px;
animation-delay:5s;
animation-duration:12s;
}

.comet:nth-child(3){
top:76%;
left:-140px;
animation-delay:8s;
animation-duration:10s;
}

@keyframes comet{
0%{transform:translateX(0) rotate(-35deg);opacity:0}
8%{opacity:.9}
40%{opacity:.9}
55%,100%{transform:translateX(125vw) rotate(-35deg);opacity:0}
}

.deck{
width:min(420px,92vw);
max-height:94vh;
background:rgba(18,18,18,.94);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
overflow:hidden;
box-shadow:0 22px 55px rgba(0,0,0,.6);
backdrop-filter:blur(10px);
}

.top{
padding:20px 18px 18px;
border-bottom:1px solid var(--line);
}

.label{
text-align:center;
color:#fff;
font-family:Georgia,"Times New Roman",serif;
font-size:20px;
font-weight:600;
letter-spacing:.04em;
animation:pulse 4s ease-in-out infinite;
}

@keyframes pulse{
0%,100%{opacity:.7}
50%{opacity:1}
}

.title{
margin:8px 0 0;
text-align:center;
font-size:13px;
font-weight:400;
color:var(--muted);
}

.player{
width:100%;
aspect-ratio:16/9;
margin-top:16px;
border-radius:10px;
overflow:hidden;
background:#000;
box-shadow:0 10px 28px rgba(0,0,0,.7);
}

.player iframe{
width:100%;
height:100%;
}

.controls{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
padding:16px;
border-bottom:1px solid var(--line);
}

.control,
.play{
border:0;
cursor:pointer;
}

.control{
background:none;
color:var(--text);
font-size:20px;
}

.control:first-child{
justify-self:end;
margin-right:30px;
}

.control:last-child{
justify-self:start;
margin-left:30px;
}

.play{
width:56px;
height:56px;
border-radius:50%;
background:#fff;
color:#111;
font-size:20px;
}

.library{
padding:14px 16px 16px;
}

.library-toggle{
width:100%;
display:flex;
justify-content:center;
align-items:center;
gap:8px;
padding:10px;
border:0;
background:none;
color:var(--muted);
font-size:11px;
letter-spacing:.08em;
text-transform:uppercase;
cursor:pointer;
}

.library-toggle span:last-child{
font-size:14px;
transition:transform .2s ease;
}

.library-toggle.open span:last-child{
transform:rotate(180deg);
}

.playlist-wrap{
max-height:0;
overflow:hidden;
transition:max-height .25s ease;
}

.playlist-wrap.open{
max-height:132px;
overflow-y:auto;
}

.playlist-wrap::-webkit-scrollbar{
width:5px;
}

.playlist-wrap::-webkit-scrollbar-thumb{
background:#444;
border-radius:10px;
}

.playlist{
width:100%;
min-height:44px;
display:flex;
align-items:center;
justify-content:center;
padding:10px;
border:0;
border-top:1px solid var(--line);
background:none;
color:var(--text);
font-size:12px;
text-align:center;
cursor:pointer;
}

.playlist.active{
color:var(--accent);
}

@media(max-height:650px){
.deck{transform:scale(.9)}
}

@media(prefers-reduced-motion:reduce){
.comet,
.label{
animation:none;
}
}
</style>
</head>

<body>

<div class="comet"></div>
<div class="comet"></div>
<div class="comet"></div>

<main class="deck">

<section class="top">
<div class="label">Now Playing</div>
<div class="title" id="title">Blaze's Cool Mixtape</div>

<div class="player">
<div id="player"></div>
</div>
</section>

<section class="controls">
<button class="control" id="previous" aria-label="Previous video">◀</button>
<button class="play" id="play" aria-label="Play">▶</button>
<button class="control" id="next" aria-label="Next video">▶</button>
</section>

<section class="library">

<button class="library-toggle" id="libraryToggle">
<span>Playlists</span>
<span>⌄</span>
</button>

<div class="playlist-wrap" id="playlistWrap">
<div id="playlistList"></div>
</div>

</section>

</main>

<script type="application/json" id="playlistData">
{
  "playlists":[
    {
      "title":"Blaze's Cool Mixtape",
      "id":"PLauF-OVoaXM8",
      "active":true
    }
  ]
}
</script>

<script>
const playlists=JSON.parse(
document.getElementById("playlistData").textContent
).playlists.filter(p=>p.active);

const title=document.getElementById("title");
const list=document.getElementById("playlistList");
const playButton=document.getElementById("play");
const toggle=document.getElementById("libraryToggle");
const wrap=document.getElementById("playlistWrap");

let player;
let current=0;

function renderActive(){
[...list.children].forEach((button,i)=>{
button.classList.toggle("active",i===current);
});
}

function loadPlaylist(index){
if(!player||!playlists.length)return;

current=index;
const playlist=playlists[current];

title.textContent=playlist.title;

player.loadPlaylist({
listType:"playlist",
list:playlist.id
});

renderActive();
}

playlists.forEach((playlist,index)=>{
const button=document.createElement("button");
button.className="playlist";
button.textContent=playlist.title;

button.addEventListener("click",()=>{
loadPlaylist(index);
});

list.appendChild(button);
});

toggle.addEventListener("click",()=>{
const open=wrap.classList.toggle("open");
toggle.classList.toggle("open",open);
});

document.getElementById("previous").addEventListener("click",()=>{
if(player)player.previousVideo();
});

document.getElementById("next").addEventListener("click",()=>{
if(player)player.nextVideo();
});

playButton.addEventListener("click",()=>{
if(!player)return;

const state=player.getPlayerState();

if(state===YT.PlayerState.PLAYING){
player.pauseVideo();
}else{
player.playVideo();
}
});

function onYouTubeIframeAPIReady(){
if(!playlists.length)return;

player=new YT.Player("player",{
playerVars:{
listType:"playlist",
list:playlists[0].id,
playsinline:1,
rel:0
},
events:{
onStateChange:event=>{
const playing=event.data===YT.PlayerState.PLAYING;
playButton.textContent=playing?"Ⅱ":"▶";
playButton.setAttribute("aria-label",playing?"Pause":"Play");
}
}
});

renderActive();
}

const api=document.createElement("script");
api.src="https://www.youtube.com/iframe_api";
document.head.appendChild(api);
</script>

</body>
</html>
