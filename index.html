<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q Deck</title>

<style>
:root{
--bg:#0d0d0d;
--panel:#171717;
--line:#2a2a2a;
--text:#f4f4f4;
--muted:#8a8a8a;
--accent:#ffd500;
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:grid;
place-items:center;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}

.deck{
width:min(420px,94vw);
background:var(--panel);
border:1px solid var(--line);
border-radius:20px;
overflow:hidden;
}

.top{
padding:18px;
border-bottom:1px solid var(--line);
}

.brand{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
font-size:12px;
letter-spacing:.12em;
text-transform:uppercase;
color:var(--muted);
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:var(--accent);
}

.label{
font-size:11px;
letter-spacing:.1em;
text-transform:uppercase;
color:var(--muted);
}

.title{
margin:6px 0 4px;
font-size:23px;
font-weight:600;
}

.sub{
font-size:13px;
color:var(--muted);
}

.player{
width:100%;
aspect-ratio:16/9;
margin-top:16px;
border-radius:10px;
overflow:hidden;
background:#000;
}

.player iframe{
width:100%;
height:100%;
}

.controls{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
padding:18px;
border-bottom:1px solid var(--line);
}

.control,
.play{
border:0;
cursor:pointer;
}

.control{
background:none;
color:var(--text);
font-size:20px;
}

.control:first-child{
justify-self:end;
margin-right:30px;
}

.control:last-child{
justify-self:start;
margin-left:30px;
}

.play{
width:58px;
height:58px;
border-radius:50%;
background:#fff;
color:#111;
font-size:20px;
}

.library{
padding:16px;
}

.library-head{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:12px;
color:var(--muted);
}

.playlist{
width:100%;
display:grid;
grid-template-columns:34px 1fr auto;
align-items:center;
gap:10px;
padding:13px 6px;
border:0;
border-top:1px solid var(--line);
background:none;
color:var(--text);
text-align:left;
cursor:pointer;
}

.playlist:first-child{border-top:0}

.playlist.active{
color:var(--accent);
}

.number{
font-size:12px;
color:var(--accent);
}

.name{font-size:15px}

.arrow{color:var(--muted)}

.playlist:hover .arrow{color:var(--accent)}
</style>
</head>

<body>

<main class="deck">

<section class="top">
<div class="brand">
<span>Q Deck</span>
<span class="dot"></span>
</div>

<div class="label">Now Playing</div>
<div class="title" id="title">Blaze's Cool Mixtape</div>
<div class="sub">YouTube Playlist</div>

<div class="player">
<div id="player"></div>
</div>
</section>

<section class="controls">
<button class="control" id="previous" aria-label="Previous playlist">◀</button>
<button class="play" id="play" aria-label="Play">▶</button>
<button class="control" id="next" aria-label="Next playlist">▶</button>
</section>

<section class="library">
<div class="library-head">
<span>Playlists</span>
<span id="count"></span>
</div>
<div id="playlistList"></div>
</section>

</main>

<script type="application/json" id="playlistData">
{
"playlists":[
{
"title":"Blaze's Cool Mixtape",
"id":"PLauF-OVoaXM8",
"active":true
}
]
}
</script>

<script>
const playlists=JSON.parse(
document.getElementById("playlistData").textContent
).playlists.filter(p=>p.active);

const title=document.getElementById("title");
const list=document.getElementById("playlistList");
const playButton=document.getElementById("play");

let player;
let current=0;

document.getElementById("count").textContent=playlists.length;

function loadPlaylist(index,autoplay=true){
if(!playlists.length)return;

current=(index+playlists.length)%playlists.length;
const p=playlists[current];

title.textContent=p.title;

player.loadPlaylist({
listType:"playlist",
list:p.id
});

if(!autoplay)player.pauseVideo();

renderActive();
}

function renderActive(){
[...list.children].forEach((button,i)=>{
button.classList.toggle("active",i===current);
});
}

playlists.forEach((p,i)=>{
const button=document.createElement("button");
button.className="playlist";

button.innerHTML=`
<span class="number">${String(i+1).padStart(2,"0")}</span>
<span class="name">${p.title}</span>
<span class="arrow">›</span>
`;

button.addEventListener("click",()=>loadPlaylist(i));
list.appendChild(button);
});

document.getElementById("previous").addEventListener("click",()=>{
loadPlaylist(current-1);
});

document.getElementById("next").addEventListener("click",()=>{
loadPlaylist(current+1);
});

playButton.addEventListener("click",()=>{
const state=player.getPlayerState();

if(state===YT.PlayerState.PLAYING){
player.pauseVideo();
}else{
player.playVideo();
}
});

function onYouTubeIframeAPIReady(){
player=new YT.Player("player",{
playerVars:{
listType:"playlist",
list:playlists[0].id,
playsinline:1
},
events:{
onStateChange:event=>{
const playing=event.data===YT.PlayerState.PLAYING;
playButton.textContent=playing?"Ⅱ":"▶";
playButton.setAttribute("aria-label",playing?"Pause":"Play");
}
}
});

renderActive();
}

const api=document.createElement("script");
api.src="https://www.youtube.com/iframe_api";
document.head.appendChild(api);
</script>

</body>
</html>
