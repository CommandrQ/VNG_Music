<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music</title>

<style>
:root{
--panel:rgba(18,18,22,.96);
--line:rgba(255,255,255,.08);
--text:#fff;
--muted:#aaa;
--accent:#ffd76a;
}

*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
display:grid;
place-items:center;
background:
radial-gradient(circle at 20% 20%,rgba(124,66,180,.35),transparent 45%),
radial-gradient(circle at 80% 70%,rgba(71,30,120,.4),transparent 50%),
linear-gradient(160deg,#0b0612,#1b0d2d 50%,#08060d);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}

#space{
position:absolute;
inset:0;
width:100%;
height:100%;
pointer-events:none;
}

.refresh{
position:absolute;
top:16px;
right:18px;
z-index:2;
text-align:right;
}

.refresh button{
padding:0;
border:0;
background:none;
color:#fff;
font:inherit;
font-size:12px;
cursor:pointer;
opacity:.8;
}

.refreshed{
display:block;
margin-top:4px;
color:rgba(255,255,255,.5);
font-size:9px;
}

.deck{
position:relative;
z-index:1;
width:min(420px,92vw);
max-height:94vh;
background:var(--panel);
border:1px solid var(--line);
border-radius:20px;
overflow:hidden;
box-shadow:0 25px 60px rgba(0,0,0,.65);
}

.top{
padding:20px 18px 18px;
border-bottom:1px solid var(--line);
}

.label{
text-align:center;
color:#fff;
font-family:Georgia,"Times New Roman",serif;
font-size:21px;
font-weight:600;
letter-spacing:.04em;
animation:pulse 4s ease-in-out infinite;
}

.title{
margin:7px 0 0;
text-align:center;
font-size:12px;
font-weight:400;
color:var(--muted);
}

.player{
width:100%;
aspect-ratio:16/9;
margin-top:16px;
border-radius:10px;
overflow:hidden;
background:#000;
box-shadow:0 12px 30px rgba(0,0,0,.75);
position:relative;
}

.player-placeholder{
position:absolute;
inset:0;
display:grid;
place-items:center;
color:var(--muted);
font-size:12px;
}

.player iframe{
width:100%;
height:100%;
}

.controls{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
padding:16px;
border-bottom:1px solid var(--line);
}

.control,.play{
border:0;
cursor:pointer;
}

.control{
background:none;
color:#fff;
font-size:20px;
}

.control:first-child{
justify-self:end;
margin-right:30px;
}

.control:last-child{
justify-self:start;
margin-left:30px;
}

.play{
width:56px;
height:56px;
border-radius:50%;
background:#fff;
color:#111;
font-size:20px;
}

.library{
padding:12px 16px 16px;
}

.library-toggle{
width:100%;
display:flex;
justify-content:center;
align-items:center;
gap:7px;
padding:10px;
border:0;
background:none;
color:var(--muted);
font-size:11px;
letter-spacing:.08em;
text-transform:uppercase;
cursor:pointer;
}

.chevron{
transition:transform .2s ease;
}

.library-toggle.open .chevron{
transform:rotate(180deg);
}

.playlist-wrap{
max-height:0;
overflow:hidden;
transition:max-height .25s ease;
}

.playlist-wrap.open{
max-height:132px;
overflow-y:auto;
}

.playlist{
width:100%;
height:44px;
display:flex;
align-items:center;
justify-content:center;
padding:8px;
border:0;
border-top:1px solid var(--line);
background:none;
color:#fff;
font-size:12px;
text-align:center;
cursor:pointer;
}

.playlist.active{
color:var(--accent);
}

@keyframes pulse{
0%,100%{opacity:.72}
50%{opacity:1}
}

@media(prefers-reduced-motion:reduce){
.label{animation:none}
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div class="refresh">
<button id="refresh">Refresh ↻</button>
<span class="refreshed" id="refreshed"></span>
</div>

<main class="deck">

<section class="top">
<div class="label">Now Playing</div>
<div class="title" id="title">Blaze's Cool Mixtape</div>

<div class="player">
<div class="player-placeholder" id="placeholder">Press play</div>
<div id="player"></div>
</div>
</section>

<section class="controls">
<button class="control" id="previous" aria-label="Previous video">◀</button>
<button class="play" id="play" aria-label="Play">▶</button>
<button class="control" id="next" aria-label="Next video">▶</button>
</section>

<section class="library">
<button class="library-toggle" id="libraryToggle">
<span>Playlists</span>
<span class="chevron">⌄</span>
</button>

<div class="playlist-wrap" id="playlistWrap">
<div id="playlistList"></div>
</div>
</section>

</main>

<script type="application/json" id="playlistData">
{
  "playlists":[
    {
      "title":"Blaze's Cool Mixtape",
      "id":"PLauF-OVoaXM8",
      "active":true
    },
    {
      "title":"Adventurer's Tale",
      "id":"PLIH8J_XrFteM",
      "active":true
    }
  ]
}
</script>

<script>
const now=new Date();
document.getElementById("refreshed").textContent=
"Last refreshed "+now.toLocaleString([],{
month:"short",
day:"numeric",
hour:"numeric",
minute:"2-digit"
});

document.getElementById("refresh").addEventListener("click",()=>location.reload());

const playlists=JSON.parse(
document.getElementById("playlistData").textContent
).playlists.filter(p=>p.active);

const title=document.getElementById("title");
const list=document.getElementById("playlistList");
const playButton=document.getElementById("play");
const toggle=document.getElementById("libraryToggle");
const wrap=document.getElementById("playlistWrap");
const placeholder=document.getElementById("placeholder");

let player=null;
let apiLoading=false;
let current=0;
let pendingAction=null;

function renderActive(){
[...list.children].forEach((button,i)=>{
button.classList.toggle("active",i===current);
});
}

function loadAPI(action){
pendingAction=action;

if(player){
action();
return;
}

if(apiLoading)return;
apiLoading=true;

window.onYouTubeIframeAPIReady=()=>{
player=new YT.Player("player",{
playerVars:{
listType:"playlist",
list:playlists[current].id,
playsinline:1,
rel:0
},
events:{
onReady:()=>{
placeholder.style.display="none";
if(pendingAction){
const action=pendingAction;
pendingAction=null;
action();
}
},
onStateChange:event=>{
const playing=event.data===YT.PlayerState.PLAYING;
playButton.textContent=playing?"Ⅱ":"▶";
playButton.setAttribute("aria-label",playing?"Pause":"Play");
}
}
});
};

const script=document.createElement("script");
script.src="https://www.youtube.com/iframe_api";
document.head.appendChild(script);
}

function loadPlaylist(index){
current=index;
title.textContent=playlists[index].title;
renderActive();

loadAPI(()=>{
player.loadPlaylist({
listType:"playlist",
list:playlists[index].id
});
});
}

playlists.forEach((playlist,index)=>{
const button=document.createElement("button");
button.className="playlist";
button.textContent=playlist.title;

button.addEventListener("click",()=>{
loadPlaylist(index);
wrap.classList.remove("open");
toggle.classList.remove("open");
});

list.appendChild(button);
});

renderActive();

toggle.addEventListener("click",()=>{
const open=wrap.classList.toggle("open");
toggle.classList.toggle("open",open);
});

playButton.addEventListener("click",()=>{
loadAPI(()=>{
const state=player.getPlayerState();

if(state===YT.PlayerState.PLAYING){
player.pauseVideo();
}else{
player.playVideo();
}
});
});

document.getElementById("previous").addEventListener("click",()=>{
loadAPI(()=>player.previousVideo());
});

document.getElementById("next").addEventListener("click",()=>{
loadAPI(()=>player.nextVideo());
});

const canvas=document.getElementById("space");
const ctx=canvas.getContext("2d");
const reducedMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;

let stars=[];
let comets=[];
let width=0;
let height=0;
let lastFrame=0;
let lastComet=0;
let nextComet=4000+Math.random()*6000;

function resizeSpace(){
const dpr=Math.min(devicePixelRatio||1,1.5);

width=innerWidth;
height=innerHeight;

canvas.width=width*dpr;
canvas.height=height*dpr;
canvas.style.width=width+"px";
canvas.style.height=height+"px";

ctx.setTransform(dpr,0,0,dpr,0,0);

const count=Math.min(90,Math.max(45,Math.floor(width*height/14000)));

stars=Array.from({length:count},()=>({
x:Math.random()*width,
y:Math.random()*height,
r:Math.random()*.9+.25,
speed:Math.random()*.07+.015,
alpha:Math.random()*.55+.3
}));
}

function createComet(){
const fromLeft=Math.random()>.5;
const length=70+Math.random()*90;

comets.push({
x:fromLeft?-length:width+length,
y:Math.random()*height*.75,
vx:(fromLeft?1:-1)*(4+Math.random()*2),
vy:1.2+Math.random()*1.5,
length
});
}

function drawSpace(time){
if(time-lastFrame<33){
requestAnimationFrame(drawSpace);
return;
}

lastFrame=time;
ctx.clearRect(0,0,width,height);

for(const star of stars){
star.y+=star.speed;

if(star.y>height){
star.y=0;
star.x=Math.random()*width;
}

ctx.beginPath();
ctx.fillStyle=`rgba(255,255,255,${star.alpha})`;
ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
ctx.fill();
}

if(time-lastComet>nextComet){
createComet();
lastComet=time;
nextComet=5000+Math.random()*8000;
}

for(let i=comets.length-1;i>=0;i--){
const c=comets[i];
c.x+=c.vx;
c.y+=c.vy;

const mag=Math.hypot(c.vx,c.vy);
const ux=c.vx/mag;
const uy=c.vy/mag;
const tailX=c.x-ux*c.length;
const tailY=c.y-uy*c.length;

const gradient=ctx.createLinearGradient(tailX,tailY,c.x,c.y);
gradient.addColorStop(0,"rgba(255,215,106,0)");
gradient.addColorStop(1,"rgba(255,239,170,.95)");

ctx.strokeStyle=gradient;
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(tailX,tailY);
ctx.lineTo(c.x,c.y);
ctx.stroke();

if(c.x<-200||c.x>width+200||c.y>height+150){
comets.splice(i,1);
}
}

requestAnimationFrame(drawSpace);
}

resizeSpace();
addEventListener("resize",resizeSpace);

if(!reducedMotion){
requestAnimationFrame(drawSpace);
}
</script>

</body>
</html>
